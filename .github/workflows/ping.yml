name: Ping

# GitHub's cron is best-effort: on this repo a "*/10" schedule fired once in twelve hours. So each run
# pings for about five and a half hours (33 rounds, 10 minutes apart) and then starts the next run
# itself. The cron only re-arms the chain if it ever breaks; the concurrency group keeps it to one
# running and one queued run.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node ping.mjs --rounds 33 --every 600
        env:
          COCKPIT_URL: ${{ secrets.COCKPIT_URL }}
          PINGS_HMAC_SECRET: ${{ secrets.PINGS_HMAC_SECRET }}
      # Only a run whose heartbeats were accepted hands over to the next one; if the cockpit stops
      # accepting them the chain ends and the cron brings it back later.
      - name: Start the next run
        if: success()
        run: gh workflow run ping.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
